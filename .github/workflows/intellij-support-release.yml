name: Release IntelliJ support

on:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:
    inputs:
      version:
        description: Non-SNAPSHOT helper release version (Central auto-publication)
        required: true

permissions:
  contents: read

concurrency:
  group: intellij-support-release-${{ github.ref }}
  cancel-in-progress: false

# Scoped release of the already-verified helper only: helper build, release-configuration
# tests and publication verification run inside publish-release.sh. The broad Test
# workflow (private engine/compiler suites, IDE fixture lanes) stays the CI policy for
# ordinary pushes and is not repeated here. Publication is always automatic (--auto).
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Determine release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#release/}"
          else
            VERSION="$INPUT_VERSION"
          fi
          python3 tools/release_config.py validate "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin Toolchain and dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            ~/.cache/JetBrains/Kotlin/download.cache
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-${{ runner.os }}-
      - name: Publish checked, signed helper to Central (automatic publication)
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME || secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD || secrets.KOTLIN_TOOLCHAIN_MAVENCENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE || secrets.KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE }}
        run: bash ./publish-release.sh "$RELEASE_VERSION" --auto

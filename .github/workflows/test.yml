name: Test

on:
  push:
    branches-ignore:
      - 'release/**'
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check helper release configuration
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Cache Kotlin Toolchain and dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            ~/.cache/JetBrains/Kotlin/download.cache
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-${{ runner.os }}-
      - name: Assemble Brikk Engine Kotlin compiler plugin
        run: ./kotlin do assemblePluginJar -m brikk-engine-kotlin-compiler-plugin
      - name: Build
        run: ./kotlin build
      - name: Test
        run: ./kotlin test
      - name: Verify schema-only incremental rebuilds without a clean
        run: ./kotlin do verifySchemaRefresh -m brikk-engine-kotlin-compiler-plugin
      - name: Verify real IntelliJ host and shape fixtures
        run: ./kotlin check intellijSupport -m brikk-engine-kotlin-intellij-support
      - name: Publish and verify the helper in Maven Local
        run: |
          ./kotlin publish mavenLocal -m brikk-engine-kotlin-intellij-support
          ./kotlin do verifyLocalIntellijPublication -m brikk-engine-kotlin-intellij-support

  ide-compiler:
    # This is compiler API/artifact acceptance, NOT live IDE/KEFS acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - compiler: 2.4.20-ij262-34
            module: brikk-engine-kotlin-compiler-ide
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache Kotlin Toolchain and dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            ~/.cache/JetBrains/Kotlin/download.cache
            ~/.cache/JetBrains/Kotlin/.m2.cache
          key: compiler-ide-${{ matrix.compiler }}-${{ hashFiles('kotlin', '**/module.yaml') }}
          restore-keys: |
            compiler-ide-${{ matrix.compiler }}-
      - name: Compile and verify the exact IDE-compiler artifact
        run: ./kotlin do verifyIdePlugin -m ${{ matrix.module }}
      - name: Verify local Maven publication
        run: ./kotlin do publishKefsRepo -m ${{ matrix.module }}

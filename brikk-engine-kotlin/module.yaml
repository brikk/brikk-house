# Kotlin runtime for Brikk Engine: the types user code references
# (Shape/Partial/Rel, @BrikkSql/@BrikkTrait, Sql.<dialect>()) and the rendering of a
# composed pipeline value back to dialect SQL via brikk-sql.
product: jvm/lib

dependencies:
  - dev.brikk.house:brikk-sql-jvm:0.18.0: exported

test-dependencies:
  - org.duckdb:duckdb_jdbc:1.5.5.0

settings:
  jvm:
    test:
      freeJvmArgs: ["--enable-native-access=ALL-UNNAMED"]
  kotlin:
    version: 2.4.10

product: jvm/lib
description: chDB v26.5.0 native resource for Linux x86_64.

apply:
  - ../../publish.module-template.yaml

plugins:
  brikk-chdb-native-packaging: enabled

test-dependencies:
  - ../brikk-chdb

settings:
  publishing:
    artifactId: brikk-chdb-native-linux-x64
  jvm:
    jdk:
      version: 25
    test:
      freeJvmArgs: ["--enable-native-access=ALL-UNNAMED"]
  kotlin:
    version: 2.4.10

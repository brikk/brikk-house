# In-process chDB binding. Consumers add one matching brikk-chdb-native-* runtime artifact or
# configure an explicit library path; see docs/design/brikk-chdb.md for the ABI policy.
product: jvm/lib

description: In-process Kotlin/JVM binding for the embedded chDB ClickHouse engine.

apply:
  - ../../publish.module-template.yaml

settings:
  publishing:
    artifactId: brikk-chdb
  jvm:
    # The final java.lang.foreign API is required; this is intentionally not JNI/JNA.
    jdk:
      version: 25
  kotlin:
    version: 2.4.10

tasks:
  captureDorisSchema:
    action: !dev.brikk.house.sql.tooling.captureDorisSchema
      projectFile: ${project.rootDir}/project.yaml

  assemblePluginJar:
    action: !dev.brikk.house.sql.tooling.assemblePluginJar
      pluginJar: ${module.jar}
      runtimeClasspath: ${module.runtimeClasspath}
      compileClasspath: ${module.compileClasspath}
      artifactId: ${pluginSettings.artifactId}
      kotlinVersion: ${module.settings.kotlin.version}
      ideKotlinVersion: ${pluginSettings.ideKotlinVersion}
      sourceDir: ${project.rootDir}/brikk-engine/brikk-engine-kotlin-compiler-plugin/src
      resourcesDir: ${project.rootDir}/brikk-engine/brikk-engine-kotlin-compiler-plugin/resources
      libVersion: ${pluginSettings.libVersion}
      bundleExcludes: ${pluginSettings.bundleExcludes}
      # Stable, short location (not ${taskOutputDir}) because brikk-engine-kotlin-smoke refers to
      # the jar by path in its `-Xplugin=` argument, and KEFS matches on the file name.
      outputDir: ${project.rootDir}/${pluginSettings.assembledDir}

  publishKefsRepo:
    action: !dev.brikk.house.sql.tooling.publishKefsRepo
      assembledDir: ${tasks.assemblePluginJar.action.outputDir}
      artifactId: ${pluginSettings.artifactId}
      ideKotlinVersion: ${pluginSettings.ideKotlinVersion}
      kotlinVersion: ${module.settings.kotlin.version}
      libVersion: ${pluginSettings.libVersion}
      repoDir: ${project.rootDir}/${pluginSettings.repoDir}

  verifyIdePlugin:
    action: !dev.brikk.house.sql.tooling.verifyIdePlugin
      assembledDir: ${tasks.assemblePluginJar.action.outputDir}
      compilerClasspath: ${module.runtimeClasspath}
      compilerVersion: ${pluginSettings.ideKotlinVersion}
      artifactId: ${pluginSettings.artifactId}
      libVersion: ${pluginSettings.libVersion}
      fixturesDir: ${project.rootDir}/brikk-engine/brikk-engine-kotlin-compiler-ide/fixtures
      outputDir: ${taskOutputDir}

  verifySchemaRefresh:
    action: !dev.brikk.house.sql.tooling.verifySchemaRefresh
      wrapper: ${project.rootDir}/kotlin
      assembledDir: ${tasks.assemblePluginJar.action.outputDir}
      runtimeModuleDir: ${project.rootDir}/brikk-engine/brikk-engine-kotlin
      schemaPluginDir: ${project.rootDir}/brikk-engine/brikk-engine-kotlin-schema-inputs
      libVersion: ${pluginSettings.libVersion}
      outputDir: ${taskOutputDir}

commands:
  - captureDorisSchema
  - assemblePluginJar
  - publishKefsRepo
  - verifyIdePlugin
  - verifySchemaRefresh

# Build-time-only Kotlin Toolchain plugin for the Brikk Engine Kotlin compiler plugin:
#   ./kotlin do assemblePluginJar   -> dependency-relocated CLI and IDE-candidate jars
#   ./kotlin do publishKefsRepo     -> separate local Maven repos for the actual compiler versions
#   ./kotlin do verifyIdePlugin -m brikk-engine-kotlin-compiler-ide -> exact IDE-compiler artifact fixtures
# Applied by ../brikk-engine-kotlin-compiler-plugin/module.yaml. Replaces tools/assemble_plugin_jar.py and
# tools/publish_local_repo.py: inputs come from the build graph (module jar, resolved runtime
# classpath) instead of globbing the dependency cache.
product: jvm/amper-plugin

pluginInfo:
  settingsClass: dev.brikk.house.sql.tooling.Settings

dependencies:
  - dev.brikk.house:brikk-sql-jvm:0.18.0
  - ../brikk-engine-kotlin-schema-inputs
  # Build-time bytecode relocation; never bundled into the compiler plugin.
  - org.ow2.asm:asm-commons:9.9.1
  # Capture tooling only: never bundled into the Kotlin compiler plugin or runtime.
  - com.mysql:mysql-connector-j:9.4.0: runtime-only

settings:
  kotlin:
    version: 2.4.10

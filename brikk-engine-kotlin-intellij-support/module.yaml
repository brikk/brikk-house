product: jvm/lib

description: Brikk Kotlin host, interpolation, and relation-shape contracts for IntelliJ SQL plugins.

apply:
  - //publish.module-template.yaml

repositories:
  # brikk-sql 0.20.0 (core relation facts) exists only in Maven Local until it is released.
  - url: mavenLocal
    resolve: true
    publish: true

dependencies:
  # exported: BrikkRelationFacts answers with core's plain relation-facts data. The helper
  # depends on core only (owner decision 24): plugins adapt it to brikk-sql support.
  - dev.brikk.house:brikk-sql-jvm:0.20.0-SNAPSHOT: exported

plugins:
  brikk-engine-kotlin-intellij-tooling: enabled

settings:
  jvm:
    release: 21
  kotlin:
    version: 2.4.10
    freeCompilerArgs:
      # Prepared as a build prerequisite, not a Maven dependency. Toolchain 0.13
      # publishes compile-only Maven dependencies as 'provided' in the POM;
      # an SDK coordinate must not become part of this library's contract.
      # The toolchain's classpath is replaced, so the Maven dependencies come merged from the
      # same preparation task (build/intellij-api/helper-dependencies.jar).
      - -classpath=build/intellij-api/intellij-kotlin-api-261.25134.95.jar:build/intellij-api/helper-dependencies.jar
    optIns:
      - org.jetbrains.kotlin.analysis.api.KaExperimentalApi

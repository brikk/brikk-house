# Smoke-test consumer for the brikk-sql compiler plugin under the real Kotlin Toolchain.
#
# Kotlin Toolchain's first-class `settings.kotlin.compilerPlugins` only accepts Maven
# coordinates (not module deps), so until we publish (KEFS-style versioned + shaded jar) we
# attach the plugin via freeCompilerArgs. The plugin needs brikk-sql (its SQL brain) and
# kotlinx-serialization on the *plugin* classpath, so we point -Xplugin at a merged jar whose
# name follows KEFS's `<artifact-id>-<kotlin-version>-<lib-version>.jar` convention (lets the
# IDE plugin recognise it without replacement patterns). Paths are relative to the project
# root; build it first (brikk-sql-plugin-tooling task; compiles the plugin as needed):
#     ./kotlin do assemblePluginJar
# freeCompilerArgs cannot reference task outputs, so the path (incl. the Kotlin version
# segment) is spelled out here and must track settings.kotlin.version of the plugin module.
# Acceptable for a smoke module, not for production wiring (see KEFS notes in docs/).
product: jvm/lib

# Not published; see publish-targets.module-template.yaml for why this is applied anyway.
apply:
  - ../publish-targets.module-template.yaml

dependencies:
  - ../brikk-sql-runtime

settings:
  kotlin:
    version: 2.4.10
    freeCompilerArgs:
      - -Xplugin=build/plugin/brikk-sql-compiler-plugin-2.4.10-0.2.0.jar
      - -P
      - plugin:dev.brikk.house.sql.compiler:schema=brikk-sql-plugin-smoke/schema/events.sql
      - -P
      - plugin:dev.brikk.house.sql.compiler:defaultSchema=public
